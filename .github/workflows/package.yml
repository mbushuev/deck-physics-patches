name: Package game patches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and verify the patch archive
        run: |
          python3 -m zipfile -c deck-physx-patches.zip patches
          unzip -tq deck-physx-patches.zip
      - name: Upload the private patch archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: deck-physx-patches.zip
          archive: false
          if-no-files-found: error

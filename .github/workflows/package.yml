name: Package game patches

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Build and verify the patch archive
        id: package
        run: |
          version=$(cat VERSION)
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo '::error::VERSION must contain a version in MAJOR.MINOR.PATCH format.'
            exit 1
          fi
          archive="DeckPhysics-Patches-$version.zip"
          python3 -m zipfile -c "$archive" patches
          unzip -tq "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Upload the private patch archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          path: ${{ steps.package.outputs.archive }}
          archive: false
          if-no-files-found: error
